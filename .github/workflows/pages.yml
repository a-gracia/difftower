# Publishes site/ to GitHub Pages at difftower.com, with install.sh beside
# it so `curl -fsSL https://difftower.com/install.sh | sh` works.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "install.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages on a free plan needs a public repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: cp install.sh site/install.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
